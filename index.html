<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Fire Zone Brasil - Battle Royale PWA</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #0f172a; font-family: sans-serif; color: #f8fafc; }
        #game-container { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        canvas { display: block; background: #1e293b; width: 100%; height: 100%; }
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(15, 23, 42, 0.95); z-index: 10; padding: 20px; text-align: center; }
        .hidden { display: none !important; }
        .btn { background: #10b981; color: white; border: none; padding: 15px 30px; font-size: 1.2rem; font-weight: bold; border-radius: 12px; cursor: pointer; margin: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); width: 80%; max-width: 300px; }
        .btn-pix { background: #0284c7; }
        h1 { font-size: 2.2rem; margin-bottom: 10px; color: #38bdf8; text-transform: uppercase; letter-spacing: 2px; }
        p { margin-bottom: 20px; color: #94a3b8; font-size: 1rem; }
        .biomes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 400px; margin-bottom: 20px; }
        .biome-card { background: #334155; border: 2px solid #475569; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: bold; }
        .biome-card.selected { border-color: #10b981; background: #064e3b; }
        #hud { position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; z-index: 5; pointer-events: none; font-size: 1.1rem; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Tela Principal / Menu -->
        <div id="main-screen" class="screen">
            <h1>Fire Zone Brasil</h1>
            <p>Battle Royale PWA - 100% Brasileiro</p>
            
            <p style="font-size: 0.9rem; margin-bottom: 5px;">Escolha seu Bioma:</p>
            <div class="biomes">
                <div class="biome-card selected" onclick="selectBiome('Amazônia', this)">Amazônia</div>
                <div class="biome-card" onclick="selectBiome('Cerrado', this)">Cerrado</div>
                <div class="biome-card" onclick="selectBiome('Caatinga', this)">Caatinga</div>
                <div class="biome-card" onclick="selectBiome('Pantanal', this)">Pantanal</div>
            </div>

            <button class="btn" onclick="startGame()">JOGAR AGORA</button>
            <button class="btn btn-pix" onclick="openPixShop()">LOJA PIX</button>
        </div>

        <!-- Tela da Loja Pix -->
        <div id="pix-screen" class="screen hidden">
            <h1>Loja Pix</h1>
            <p>Compre Diamantes instantaneamente via Pix automático.</p>
            <div style="background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; width: 90%; max-width: 350px;">
                <p style="color: #f8fafc; font-size: 1.2rem; margin-bottom: 10px;">💎 1.000 Diamantes</p>
                <p style="color: #10b981; font-size: 1.5rem; font-weight: bold; margin-bottom: 15px;">R$ 10,00</p>
                <button class="btn btn-pix" onclick="generatePixCode()" style="width: 100%; margin: 0;">Gerar Pix Copia e Cola</button>
                <p id="pix-status" style="margin-top: 15px; font-size: 0.85rem; word-break: break-all;"></p>
            </div>
            <button class="btn" onclick="closePixShop()" style="background: #64748b;">Voltar</button>
        </div>

        <!-- HUD do Jogo -->
        <div id="hud" class="hidden">
            <div id="hud-stats">Vivo: 30 | Kills: 0</div>
            <div id="hud-zone" style="color: #ef4444;">Zona: 30s</div>
        </div>

        <!-- Canvas do Jogo -->
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let gameRunning = false;
        let player = { x: 0, y: 0, radius: 15, color: '#38bdf8', speed: 4 };
        let keys = { w: false, a: false, s: false, d: false, up: false, left: false, down: false, right: false };
        let touchX = null, touchY = null;
        let selectedBiomeName = 'Amazônia';
        let zoneTimer = 30;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function selectBiome(name, element) {
            document.querySelectorAll('.biome-card').forEach(c => c.classList.remove('selected'));
            element.classList.add('selected');
            selectedBiomeName = name;
        }

        function openPixShop() {
            document.getElementById('main-screen').classList.add('hidden');
            document.getElementById('pix-screen').classList.remove('hidden');
        }

        function closePixShop() {
            document.getElementById('pix-screen').classList.add('hidden');
            document.getElementById('main-screen').classList.remove('hidden');
        }

        function generatePixCode() {
            const statusEl = document.getElementById('pix-status');
            statusEl.style.color = '#38bdf8';
            statusEl.innerText = "Chave Pix Copia e Cola Gerada (Simulação):\n00020126580014br.gov.bcb.pix...";
        }

        function startGame() {
            document.getElementById('main-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            player.x = canvas.width / 2;
            player.y = canvas.height / 2;
            gameRunning = true;
            loop();
        }

        // Controles Touch / Mobile
        window.addEventListener('touchmove', (e) => {
            if(!gameRunning) return;
            const touch = e.touches[0];
            touchX = touch.clientX;
            touchY = touch.clientY;
        });

        window.addEventListener('touchend', () => {
            touchX = null;
            touchY = null;
        });

        function update() {
            if (!gameRunning) return;

            // Movimentação por toque ou teclado
            if (touchX !== null && touchY !== null) {
                let dx = touchX - player.x;
                let dy = touchY - player.y;
                let dist = Math.hypot(dx, dy);
                if (dist > 2) {
                    player.x += (dx / dist) * player.speed;
                    player.y += (dy / dist) * player.speed;
                }
            }

            // Limites da Tela
            if (player.x < player.radius) player.x = player.radius;
            if (player.x > canvas.width - player.radius) player.x = canvas.width - player.radius;
            if (player.y < player.radius) player.y = player.radius;
            if (player.y > canvas.height - player.radius) player.y = player.radius;
        }

        function draw() {
            // Fundo dinâmico por Bioma
            ctx.fillStyle = selectedBiomeName === 'Cerrado' ? '#78350f' : 
                            selectedBiomeName === 'Caatinga' ? '#ca8a04' : 
                            selectedBiomeName === 'Pantanal' ? '#164e63' : '#064e3b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Desenhar Jogador
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = player.color;
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();
            ctx.closePath();
        }

        function loop() {
            if (!gameRunning) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
