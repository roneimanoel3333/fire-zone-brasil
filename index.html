<!DOCTYPE html>
<html lang="pt‑BR">
<head>
<meta charset="UTF‑8">
<meta name="viewport" content="width=device‑width, initial‑scale=1.0, maximum‑scale=1.0, user‑scalable=no">
<title>Batalha das Matas</title>
<style>
*{margin:0;padding:0;box‑sizing:border‑box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;touch‑action:none}
#tela{display:block;width:100%;height:calc(100%‑140px);background:#87ceeb}
#controles{position:fixed;bottom:10px;left:10px;display:grid;grid‑template‑columns:45px 45px 45px;gap:4px}
#tiro{position:fixed;bottom:10px;right:10px;width:60px;height:60px;border‑radius:50%;background:#ff4444;color:#fff;font‑size:18px;border:none}
.botao{width:45px;height:45px;background:#ffffffaa;border:none;border‑radius:6px;font‑size:20px}
</style>
</head>
<body>
<canvas id="tela"></canvas>
<div id="controles">
  <div></div>
  <button class="botao" id="cima">↑</button>
  <div></div>
  <button class="botao" id="esq">←</button>
  <button class="botao" id="baixo">↓</button>
  <button class="botao" id="dir">→</button>
</div>
<button id="tiro">TIRO</button>
<script>
const tela = document.getElementById("tela");
const ctx = tela.getContext("2d");
function ajustarTela(){
  tela.width = tela.clientWidth;
  tela.height = tela.clientHeight;
}
ajustarTela();
window.addEventListener("resize",ajustarTela);

// Biomas do mapa
let biomas = [];
function montarBiomas(){
  const w = tela.width;
  const h = tela.height;
  biomas = [
    {nome:"Cerrado",cor:"#c9b37e",x:0,y:0,w:w/2,h:h/2},
    {nome:"Amazônia",cor:"#2a5934",x:w/2,y:0,w:w/2,h:h/2},
    {nome:"Pantanal",cor:"#6399b3",x:0,y:h/2,w:w/2,h:h/2},
    {nome:"Mata Atlântica",cor:"#3a7040",x:w/2,y:h/2,w:w/2,h:h/2}
  ];
}
montarBiomas();

// Jogador
const jogador = {x:tela.width/2,y:tela.height/2,tam:22,vel:3.5,vida:100};
let direcao = {cima:false,baixo:false,esq:false,dir:false};
let projeteis = [];
let inimigos = [];
let zona = {x:0,y:0,w:tela.width,h:tela.height,reduz:0.08};
let fimJogo = false;

// Botões
document.getElementById("cima").addEventListener("touchstart",()=>direcao.cima=true);
document.getElementById("cima").addEventListener("touchend",()=>direcao.cima=false);
document.getElementById("baixo").addEventListener("touchstart",()=>direcao.baixo=true);
document.getElementById("baixo").addEventListener("touchend",()=>direcao.baixo=false);
document.getElementById("esq").addEventListener("touchstart",()=>direcao.esq=true);
document.getElementById("esq").addEventListener("touchend",()=>direcao.esq=false);
document.getElementById("dir").addEventListener("touchstart",()=>direcao.dir=true);
document.getElementById("dir").addEventListener("touchend",()=>direcao.dir=false);
document.getElementById("tiro").addEventListener("touchstart",()=>{
  if(fimJogo) return;
  projeteis.push({x:jogador.x,y:jogador.y‑12,vel:‑6,tam:6});
});

// Criar inimigos
function criarInimigo(){
  const lado = Math.floor(Math.random()*4);
  let ix,iy;
  if(lado===0){ix=0;iy=Math.random()*tela.height}
  else if(lado===1){ix=tela.width;iy=Math.random()*tela.height}
  else if(lado===2){ix=Math.random()*tela.width;iy=0}
  else {ix=Math.random()*tela.width;iy=tela.height}
  inimigos.push({x:ix,y:iy,tam:20,vel:1.2,vida:30});
}

// Atualizar
function atualizar(){
  if(fimJogo) return;
  if(direcao.cima) jogador.y -= jogador.vel;
  if(direcao.baixo) jogador.y += jogador.vel;
  if(direcao.esq) jogador.x -= jogador.vel;
  if(direcao.dir) jogador.x += jogador.vel;

  jogador.x = Math.max(zona.x, Math.min(zona.x+zona.w‑jogador.tam, jogador.x));
  jogador.y = Math.max(zona.y, Math.min(zona.y+zona.h‑jogador.tam, jogador.y));

  zona.w -= zona.reduz; zona.h -= zona.reduz;
  zona.x += zona.reduz/2; zona.y += zona.reduz/2;

  for(let p of projeteis) p.y += p.vel;
  projeteis = projeteis.filter(p=>p.y>0);

  for(let i of inimigos){
    let dx = jogador.x‑i.x;
    let dy = jogador.y‑i.y;
    let dist = Math.sqrt(dx*dx+dy*dy);
    if(dist>0){i.x += (dx/dist)*i.vel; i.y += (dy/dist)*i.vel}
  }

  for(let p of projeteis){
    for(let i of inimigos){
      let d = Math.sqrt((p.x‑i.x)**2+(p.y‑i.y)**2);
      if(d<18){i.vida -=15; p.y=‑100}
    }
  }
  inimigos = inimigos.filter(i=>i.vida>0);

  for(let i of inimigos){
    let d = Math.sqrt((jogador.x‑i.x)**2+(jogador.y‑i.y)**2);
    if(d<22) jogador.vida -=0.3;
  }

  if(jogador.vida <=0) fimJogo=true;
}

// Desenhar
function desenhar(){
  ctx.clearRect(0,0,tela.width,tela.height);
  biomas.forEach(b=>{
    ctx.fillStyle = b.cor;
    ctx.fillRect(b.x,b.y,b.w,b.h);
    ctx.fillStyle="#fff";
    ctx.font="12px sans‑serif";
    ctx.fillText(b.nome,b.x+8,b.y+20);
  });

  ctx.strokeStyle="#ffdd00";
  ctx.lineWidth=3;
  ctx.strokeRect(zona.x,zona.y,zona.w,zona.h);

  ctx.fillStyle="#ff4444";
  ctx.fillRect(jogador.x‑jogador.tam/2, jogador.y‑jogador.tam/2, jogador.tam, jogador.tam);

  ctx.fillStyle="#ffff00";
  for(let p of projeteis) ctx.beginPath(), ctx.arc(p.x,p.y,p.tam,0,Math.PI*2), ctx.fill();

  ctx.fillStyle="#222222";
  for(let i of inimigos) ctx.fillRect(i.x‑i.tam/2,i.y‑i.tam/2,i.tam,i.tam);

  ctx.fillStyle="#fff";
  ctx.font="14px sans‑serif";
  ctx.fillText(`Vida: ${Math.round(jogador.vida)}`,10,30);

  if(fimJogo){
    ctx.fillStyle="#ff2222";
    ctx.font="22px sans‑serif";
    ctx.fillText("GAME OVER",tela.width/2‑80,tela.height/2);
  }
}

setInterval(criarInimigo,2200);
function loop(){
  atualizar();
  desenhar();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
